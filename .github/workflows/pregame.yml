name: Pregame check

# An outside scheduler starts this check every 15 minutes. It has no schedule of its own, because GitHub's
# cron never started a run in this repository.
#
# Each check looks for a game that is 85 to 25 minutes from kickoff with no board run since its inactives
# were due (they come out 90 minutes before kickoff). The first check that finds one starts "Run the prop
# board". Later checks see that run and start nothing, so each kickoff time gets one run.
#
# The check costs no Odds API credits (the events feed is free) and installs nothing. It only spends
# credits when it starts a board run.
on:
  workflow_dispatch:

permissions:
  actions: write   # to start the board workflow and to see whether one has already started
  contents: read

concurrency:
  group: pregame-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Start a board run if a kickoff needs one
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python3 src/pregame.py --trigger

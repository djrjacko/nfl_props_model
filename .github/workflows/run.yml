name: Run the prop board

# GitHub's cron is UTC. Arizona is UTC-7 all year (no daylight saving), so each time below is
# written with its Arizona equivalent. The minutes are odd on purpose: runs queued on the hour
# are the ones GitHub delays most. Scheduled runs can still start several minutes late.
on:
  schedule:
    # Sunday slate
    - cron: "37 22 * * 5"   # Fri 3:37 PM MST   final injury report board (this run looks 60 hours ahead)
    - cron: "7 4 * * 0"     # Sat 9:07 PM MST   roster moves and line moves
    - cron: "37 13 * * 0"   # Sun 6:37 AM MST   overnight line moves
    - cron: "47 16 * * 0"   # Sun 9:47 AM MST   after early-game inactives
    - cron: "37 17 * * 0"   # Sun 10:37 AM MST  final early check
    - cron: "7 20 * * 0"    # Sun 1:07 PM MST   after late-game inactives
    - cron: "7 0 * * 1"     # Sun 5:07 PM MST   after Sunday-night inactives
    # Thursday game
    - cron: "7 4 * * 4"     # Wed 9:07 PM MST
    - cron: "7 22 * * 4"    # Thu 3:07 PM MST
    - cron: "52 23 * * 4"   # Thu 4:52 PM MST   after inactives
    # Monday game
    - cron: "7 4 * * 1"     # Sun 9:07 PM MST
    - cron: "7 22 * * 1"    # Mon 3:07 PM MST
    - cron: "52 23 * * 1"   # Mon 4:52 PM MST   after inactives
  workflow_dispatch:
    inputs:
      hours:
        description: "Look ahead this many hours for kickoffs (36 normally, 60 to see Sunday from Friday)"
        required: true
        default: "36"

permissions:
  contents: write   # the run commits docs/ and logs/ back to the repo

concurrency:
  group: prop-board
  cancel-in-progress: false

jobs:
  board:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Decide how far ahead to look
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          ASKED: ${{ inputs.hours }}
        run: |
          hours=36
          if [ "$EVENT" = "workflow_dispatch" ]; then
            case "$ASKED" in
              ''|*[!0-9.]*) echo "hours must be a number, got '$ASKED'"; exit 1 ;;
              *) hours="$ASKED" ;;
            esac
          elif [ "$SCHEDULE" = "37 22 * * 5" ]; then
            hours=60   # Friday afternoon plus 36 hours ends before any Sunday kickoff
          fi
          echo "HOURS=$hours" >> "$GITHUB_ENV"
          echo "Looking $hours hours ahead."

      - name: Unit tests
        run: python -m unittest discover -s tests

      - name: Fetch nflverse data
        run: python src/fetch_nflverse.py --no-report

      - name: Pull odds (spends Odds API credits)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python src/fetch_odds.py --pull --hours "$HOURS"

      - name: Fetch player status
        # If ESPN and the fallback both fail, the board still builds and marks every leg "no status data".
        continue-on-error: true
        run: python src/fetch_status.py --hours "$HOURS"

      - name: Build the board
        run: python src/board.py --hours "$HOURS"

      - name: Commit docs and logs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs logs
          if git diff --cached --quiet; then
            echo "Nothing changed, nothing to commit."
            exit 0
          fi
          git commit -m "Board update $(TZ=America/Phoenix date '+%a %b %d %-I:%M %p') MST"
          git pull --rebase
          git push

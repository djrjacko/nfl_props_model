name: Run the prop board

# This workflow has no schedule of its own. GitHub's cron never started a run in this repository, so every
# run is started from outside with GitHub's "workflow dispatch" call:
#   - an outside scheduler starts it a few times a day (the README's Schedule section lists its jobs)
#   - pregame.yml starts it at the first check after a game's inactives are due
#   - the Re-run tab on the site and the "Run workflow" button on GitHub start it by hand
on:
  workflow_dispatch:
    inputs:
      hours:
        description: "Look ahead this many hours for kickoffs (the outside jobs send 60)"
        required: true
        default: "60"

permissions:
  contents: write   # the run commits docs/ and logs/ back to the repo

concurrency:
  group: prop-board
  cancel-in-progress: false

jobs:
  board:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Decide how far ahead to look
        env:
          ASKED: ${{ inputs.hours }}
        run: |
          case "$ASKED" in
            ''|*[!0-9.]*) echo "hours must be a number, got '$ASKED'"; exit 1 ;;
          esac
          echo "HOURS=$ASKED" >> "$GITHUB_ENV"
          echo "Looking $ASKED hours ahead."

      - name: Unit tests
        run: python -m unittest discover -s tests

      - name: Fetch nflverse data
        run: python src/fetch_nflverse.py --no-report

      - name: Pull odds (spends Odds API credits)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python src/fetch_odds.py --pull --hours "$HOURS"

      - name: Fetch player status
        # If ESPN and the fallback both fail, the board still builds and marks every leg "no status data".
        continue-on-error: true
        run: python src/fetch_status.py --hours "$HOURS"

      - name: Build the board
        run: python src/board.py --hours "$HOURS"

      - name: Commit docs and logs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs logs
          if git diff --cached --quiet; then
            echo "Nothing changed, nothing to commit."
            exit 0
          fi
          git commit -m "Board update $(TZ=America/Phoenix date '+%a %b %d %-I:%M %p') MST"
          git pull --rebase
          git push
